# Keeps the BayouGuard backend on Render's free tier awake: it sleeps after
# 15 idle minutes and takes about a minute to wake, which a judge would see.
# Pings every 5 minutes (GitHub can delay scheduled runs a few minutes) and
# stops on its own after the judging window closes (Nov 23, 2026).
name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261124 ]; then
            echo "Judging is over; not pinging."
            exit 0
          fi
          curl -fsS -m 90 -o /dev/null \
            -w "backend %{http_code} in %{time_total}s\n" \
            https://bayouguard-backend-qibd.onrender.com/gauges
